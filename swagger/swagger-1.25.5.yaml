openapi: 3.0.3
info:
  title: KioskOS Backend API
  version: '1.25.5'
  description: The API exposes kiosk
    configuration, hardware control, networking, audio/TTS, transactions, fiscal/terminal operations, Android TV control, file management, QR
    scanner events, licensing and reverse-support functionality. PosnetServer and IngenicoServer proxy subpaths are intentionally described as
    transparent downstream proxies because their detailed schemas are implemented by the downstream services.
servers:
- url: http://localhost:8080
  description: Local kiosk backend (default port from server.py)
tags:
- name: General
- name: Configuration
- name: System administration
- name: System & diagnostics
- name: Kiosk
- name: Display
- name: Network
- name: Bluetooth
- name: Audio & TTS
- name: Transactions
- name: PayNow
- name: POSNETServer proxy
- name: IngenicoServer proxy
- name: Reverse proxy & support
- name: Android TV
- name: Files & resources
- name: QR scanner
- name: License
paths:
  /api/posnetserver/{path}:
    get:
      tags:
      - POSNETServer proxy
      summary: Posnet proxy
      description: Transparent proxy for the local PosnetServer service. The path after `/api/posnetserver/` is forwarded to PosnetServer.
      operationId: posnet_proxy_get
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                ok: true
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
        example: status
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          application/octet-stream:
            schema:
              type: string
              format: binary
    post:
      tags:
      - POSNETServer proxy
      summary: Posnet proxy
      description: Transparent proxy for the local PosnetServer service. The path after `/api/posnetserver/` is forwarded to PosnetServer.
      operationId: posnet_proxy_post
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                ok: true
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
        example: status
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          application/octet-stream:
            schema:
              type: string
              format: binary
    put:
      tags:
      - POSNETServer proxy
      summary: Posnet proxy
      description: Transparent proxy for the local PosnetServer service. The path after `/api/posnetserver/` is forwarded to PosnetServer.
      operationId: posnet_proxy_put
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                ok: true
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
        example: status
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          application/octet-stream:
            schema:
              type: string
              format: binary
    delete:
      tags:
      - POSNETServer proxy
      summary: Posnet proxy
      description: Transparent proxy for the local PosnetServer service. The path after `/api/posnetserver/` is forwarded to PosnetServer.
      operationId: posnet_proxy_delete
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                ok: true
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
        example: status
    patch:
      tags:
      - POSNETServer proxy
      summary: Posnet proxy
      description: Transparent proxy for the local PosnetServer service. The path after `/api/posnetserver/` is forwarded to PosnetServer.
      operationId: posnet_proxy_patch
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                ok: true
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
        example: status
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          application/octet-stream:
            schema:
              type: string
              format: binary
    options:
      tags:
      - POSNETServer proxy
      summary: Posnet proxy
      description: Transparent proxy for the local PosnetServer service. The path after `/api/posnetserver/` is forwarded to PosnetServer.
      operationId: posnet_proxy_options
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                ok: true
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
        example: status

  /api/ingenicoserver/{path}:
    get:
      tags:
      - IngenicoServer proxy
      summary: Ingenico proxy
      description: Transparent proxy for the local IngenicoServer service. The path after `/api/ingenicoserver/` is forwarded to IngenicoServer.
      operationId: ingenico_proxy_get
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                ok: true
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
        example: status
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          application/octet-stream:
            schema:
              type: string
              format: binary
