      tags:
      - IngenicoServer proxy
      summary: Ingenico proxy
      description: Transparent proxy for the local IngenicoServer service. The path after `/api/ingenicoserver/` is forwarded to IngenicoServer.
      operationId: ingenico_proxy_post
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                ok: true
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
        example: status
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          application/octet-stream:
            schema:
              type: string
              format: binary
    put:
      tags:
      - IngenicoServer proxy
      summary: Ingenico proxy
      description: Transparent proxy for the local IngenicoServer service. The path after `/api/ingenicoserver/` is forwarded to IngenicoServer.
      operationId: ingenico_proxy_put
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                ok: true
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
        example: status
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          application/octet-stream:
            schema:
              type: string
              format: binary
    delete:
      tags:
      - IngenicoServer proxy
      summary: Ingenico proxy
      description: Transparent proxy for the local IngenicoServer service. The path after `/api/ingenicoserver/` is forwarded to IngenicoServer.
      operationId: ingenico_proxy_delete
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                ok: true
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
        example: status
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          application/octet-stream:
            schema:
              type: string
              format: binary
    patch:
      tags:
      - IngenicoServer proxy
      summary: Ingenico proxy
      description: Transparent proxy for the local IngenicoServer service. The path after `/api/ingenicoserver/` is forwarded to IngenicoServer.
      operationId: ingenico_proxy_patch
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                ok: true
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
        example: status
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          application/octet-stream:
            schema:
              type: string
              format: binary
    options:
      tags:
      - IngenicoServer proxy
      summary: Ingenico proxy
      description: Transparent proxy for the local IngenicoServer service. The path after `/api/ingenicoserver/` is forwarded to IngenicoServer.
      operationId: ingenico_proxy_options
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                ok: true
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
        example: status

  /api/paynow/orders/{orderID}/capture:
    post:
      tags:
      - PayNow
      summary: Capture order route
      description: Captures a PayNow order and marks the corresponding kiosk payment as processed.
      operationId: capture_order_route_post
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                ok: true
        '500':
          description: PayNow operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: orderID
        in: path
        required: true
        schema:
          type: string
        example: '123456'
  /api/paynow/orders:
    post:
      tags:
      - PayNow
      summary: Create order route
      description: Creates a PayNow payment order and stores the kiosk cart against the returned payment ID.
      operationId: create_order_route_post
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                ok: true
        '500':
          description: PayNow operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
  /api/change-pin:
    post:
      tags:
      - General
      summary: Change pin
      description: Changes the local kiosk administration PIN.
      operationId: change_pin_post
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              example:
                ok: true
        '400':
          description: Invalid request or missing required input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePinRequest'
  /api/system-info:
    get:
      tags:
      - System & diagnostics
      summary: System info
      description: Returns RAM, disk, CPU and CPU-temperature information.
      operationId: system_info_get
      responses:
        '200':
          description: System information
          content:
            application/json:
              example:
                ram_total_mb: 4096
                ram_free_mb: 2048
                ram_used_percent: 50.0
                disk_total_gb: 32
                disk_free_gb: 20
                disk_usage_percent: 37.5
                cpu_count: 4
                cpu_usage_percent: 12.3
                cpu_temp: 54.3
  /api/usb-devices:
    get:
      tags:
      - General
      summary: Usb devices
      description: Lists detected serial/USB devices exposed as ttyUSB, ttyACM or ttyS devices.
      operationId: usb_devices_get
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                ok: true
  /api/reset-defaults:
    post:
      tags:
      - System administration
      summary: Reset defaults
      description: Removes the kiosk configuration directory so configuration can be recreated from defaults.
      operationId: reset_defaults_post
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              example:
                ok: true
        '500':
          description: Local system operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/device/turn-off:
    post:
      tags:
      - System administration
      summary: Turn off
      description: Shuts down the kiosk using the local shutdown script.
      operationId: turn_off_post
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              example:
                ok: true
        '500':
          description: Local system operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/device/reboot:
    post:
      tags:
      - System administration
      summary: Device reboot
      description: Reboots the kiosk device.
      operationId: device_reboot_post
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              example:
                ok: true
        '500':
          description: Local system operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/device/restart-ui:
    post:
      tags:
      - System administration
      summary: Device restart ui
      description: Immediately restarts the kiosk UI.
      operationId: device_restart_ui_post
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              example:
                ok: true
        '500':
          description: Local system operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/device/restart-ui-schedule:
    post:
      tags:
      - System administration
      summary: Restart ui schedule
      description: Schedules a kiosk UI restart after the requested number of seconds.
      operationId: restart_ui_schedule_post
      responses:
        '200':
          description: Restart scheduled
          content:
            application/json:
              example:
                ok: true
                scheduled_in: 30
        '400':
          description: Invalid request or missing required input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestartUiRequest'
  /api/device/logs/webview:
    post:
      tags:
      - System administration
      summary: Get webview logs
      description: Returns the collected WebView log.
      operationId: get_webview_logs_post
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                ok: true
  /api/device/logs/chromium:
    post:
      tags:
      - System administration
      summary: Get chromium logs
      description: Returns the collected Chromium log.
      operationId: get_chromium_logs_post
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                ok: true
  /api/test-communication:
    get:
      tags:
      - General
      summary: Test communication
      description: Runs the backend communication test.
      operationId: test_communication_get
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                ok: true
  /api/resources/{filename}:
    get:
      tags:
      - Files & resources
      summary: Serve resource
      description: Serves a resource from the kiosk resource area.
      operationId: serve_resource_get
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                ok: true
      parameters:
      - name: filename
        in: path
        required: true
        schema:
          type: string
      - name: width
        in: query
        required: false
        schema:
          type: integer
  /api/test-registration:
    get:
      tags:
      - General
      summary: Test registration
      description: Runs the registration test against the configured registration service.
      operationId: test_registration_get
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                ok: true
  /api/settings-update-key:
    post:
      tags:
      - General
      summary: Settings update key
      description: Updates one configuration value identified by a dotted configuration path.
      operationId: settings_update_key_post
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                ok: true
        '400':
          description: Invalid request or missing required input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdateKeyRequest'
  /api/device-id:
    get:
      tags:
      - System administration
      summary: Get device id
      description: Returns the kiosk device identifier.
      operationId: get_device_id_get
      responses:
        '200':
          description: Device identifier
          content:
            application/json:
              example:
                device_id: ABCD1234EFGH5678
    post:
      tags:
      - System administration
      summary: Regenerate device id
      description: Generates and stores a new kiosk device identifier.
      operationId: regenerate_device_id_post
      responses:
        '200':
          description: New device identifier
          content:
            application/json:
              example:
                device_id: ABCD1234EFGH5678
  /api/security-key:
    post:
      tags:
      - General
      summary: Update security key
      description: Stores the kiosk security key.
      operationId: update_security_key_post
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              example:
                ok: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityKeyRequest'
  /api/mouse-cursor:
    post:
      tags:
      - General
      summary: Update mouse cursor
      description: Enables or disables mouse-cursor display.
      operationId: update_mouse_cursor_post
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              example:
                ok: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MouseCursorRequest'
  /api/advanced/support-alt-host:
    post:
      tags:
      - System administration
      summary: Save alt support host
      description: Stores an alternative support host.
      operationId: save_alt_support_host_post
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              example:
                ok: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportHostRequest'
  /api/advanced/yaml:
    get:
      tags:
      - System administration
      summary: Get yaml
      description: Returns the IngenicoServer YAML configuration.
      operationId: get_yaml_get
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                ok: true
    post:
      tags:
      - System administration
      summary: Save yaml
      description: Overwrites the IngenicoServer YAML configuration with supplied text.
      operationId: save_yaml_post
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              example:
                ok: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextConfigRequest'
  /api/advanced/json:
    get:
      tags:
      - System administration
      summary: Get json
      description: Returns the PosnetServer JSON configuration.
      operationId: get_json_get
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                ok: true
    post:
      tags:
      - System administration
      summary: Save json
      description: Overwrites the PosnetServer JSON configuration with supplied text.
      operationId: save_json_post
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              example:
                ok: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextConfigRequest'
  /api/kiosk-nat/status:
    get:
      tags:
      - Kiosk
      summary: Kiosk nat status
      description: Returns the current kiosk NAT configuration status.
      operationId: kiosk_nat_status_get
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                ok: true
  /api/kiosk-nat/on:
    post:
      tags:
      - Kiosk
      summary: Kiosk nat on
      description: Enables kiosk NAT.
      operationId: kiosk_nat_on_post
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              example:
                ok: true
  /api/kiosk-nat/off:
    post:
      tags:
      - Kiosk
      summary: Kiosk nat off
      description: Disables kiosk NAT.
      operationId: kiosk_nat_off_post
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              example:
                ok: true
  /api/services-status:
    get:
      tags:
      - System & diagnostics
      summary: Services status
      description: Returns the status of configured backend services.
      operationId: services_status_get
      responses:
        '200':
          description: Service statuses
          content:
            application/json:
              example:
                services:
                - name: posnetserver
                  status: running
                - name: ingenicoserver
                  status: running
  /api/advanced/cmd:
    post:
      tags:
      - System administration
      summary: Run cmd
      description: Executes a command only when its base command is in the backend allow-list.
      operationId: run_cmd_post
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                ok: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
  /api/test-url:
    post:
      tags:
      - General
      summary: Test url
      description: Tests whether a supplied HTTP(S) URL is reachable and whether it exposes the kiosk settings page.
      operationId: test_url_post
      responses:
        '200':
          description: URL test result
          content:
            application/json:
              example:
                ok: true
                status: 200
                settings_link_found: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestUrlRequest'
  /api/info:
    get:
      tags:
      - System & diagnostics
      summary: Info
      description: Returns hostname, local IP addresses, MAC address and detected Ethernet interface.
      operationId: info_get
      responses:
        '200':
          description: Network/system identity
          content:
            application/json:
              example:
                hostname: kiosk-001
                ip: 192.168.1.20
                mac: AA:BB:CC:DD:EE:FF
                wlan0: 192.168.1.21
                eth0: 192.168.1.20
                eth1: ''
                ethernet_iface: eth0
  /api/health/protect-mode:
    get:
      tags:
      - System & diagnostics
      summary: Protect mode health
      description: Analyzes kiosk protected/overlay mode health.
      operationId: protect_mode_health_get
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                ok: true
  /api/health/chromium-gpu:
    get:
