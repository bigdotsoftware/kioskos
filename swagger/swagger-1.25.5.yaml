components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
      description: Bearer token returned by `/api/login`. The token is stored server-side and expires after 900 seconds.
  schemas:
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
      additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
        error:
          type: string
        details:
          type: string
      additionalProperties: true
    CreateOrderRequest:
      type: object
      required:
      - cart
      properties:
        cart:
          type: array
          items:
            type: object
        totalPrice:
          type: number
          example: 29.0
        description:
          type: string
          example: Kiosk order
        name:
          type: string
          example: Kiosk
        domain:
          type: string
          example: example.com
        protocol:
          type: string
          example: https
    ChangePinRequest:
      type: object
      required:
      - old_pin
      - new_pin
      properties:
        old_pin:
          type: string
          example: '1234'
        new_pin:
          type: string
          example: '5678'
    RestartUiRequest:
      type: object
      required:
      - seconds
      properties:
        seconds:
          type: integer
          minimum: 1
          maximum: 3600
          example: 30
    SettingsUpdateKeyRequest:
      type: object
      required:
      - path
      - value
      properties:
        path:
          type: string
          example: terminal.enabled
        value:
          description: Value assigned to the dotted configuration path.
    SecurityKeyRequest:
      type: object
      required:
      - security_key
      properties:
        security_key:
          type: string
          minLength: 16
          maxLength: 16
          example: 1234567890ABCDEF
    MouseCursorRequest:
      type: object
      required:
      - show
      properties:
        show:
          description: Boolean-like value; handler accepts boolean, 0/1 or "true"/"1".
          example: true
    SupportHostRequest:
      type: object
      required:
      - host
      properties:
        host:
          type: string
          example: support.example.com
    TextConfigRequest:
      type: object
      required:
      - content
      properties:
        content:
          type: string
          example: 'default:\n  license:\n    file: /path/license.lic\n'
    CommandRequest:
      type: object
      required:
      - cmd
      properties:
        cmd:
          type: string
          example: uptime
    TestUrlRequest:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          example: https://example.com/settings.html
        url_user:
          type: string
          example: admin
        url_pass:
          type: string
          format: password
          example: secret
    AppSettingsRequest:
      type: object
      properties:
        settings_visible:
          type: boolean
          example: true
        settings_rotate_visible:
          type: boolean
          example: true
        settings_rotate_angle:
          type: integer
          example: 180
        settings_rotate_angle_default:
          type: integer
          example: 0
        show_mouse_cursor:
          type: boolean
          example: false
        print_additional_cashier_ticket:
          type: boolean
          example: false
        screensaver_reset_cart:
          type: boolean
          example: false
        send_sales_data_to_b2b:
          type: boolean
          example: false
        mode:
          type: string
          example: kiosk-demo-kawiarnia
        localfs_selected_files:
          type: array
          items:
            type: string
        mode_url:
          type: string
          example: ''
        mode_url_user:
          type: string
          example: ''
        mode_url_pass:
          type: string
          format: password
          example: ''
        mode_url_auth_type:
          type: string
          example: front
        idle_time:
          type: integer
          example: 60
        support_alt_host:
          type: string
          example: ''
        support_keep_connection_live:
          type: boolean
          example: false
        android:
          type: object
          additionalProperties: true
        terminal:
          type: object
          additionalProperties: true
        fiscal:
          type: object
          additionalProperties: true
        barcodereader:
          type: object
          additionalProperties: true
        accessibility:
          type: object
          additionalProperties: true
        security_key:
          type: string
          example: ''
        blik:
          type: object
          additionalProperties: true
      additionalProperties: true
    LoginRequest:
      type: object
      required:
      - pin
      properties:
        pin:
          type: string
          example: '1234'
    WifiConnectRequest:
      type: object
      required:
      - ssid
      properties:
        ssid:
          type: string
          example: KioskWiFi
        password:
          type: string
          format: password
          example: wifi-password
    BluetoothTrustRequest:
      type: object
      required:
      - mac
      properties:
        mac:
          type: string
          example: AA:BB:CC:DD:EE:FF
        name:
          type: string
          example: Bluetooth Speaker
        icon:
          type: string
          example: audio-card
    BluetoothMacRequest:
      type: object
      required:
      - mac
      properties:
        mac:
          type: string
          example: AA:BB:CC:DD:EE:FF
    BluetoothPairRequest:
      type: object
      required:
      - mac
      properties:
        mac:
          type: string
          example: AA:BB:CC:DD:EE:FF
        pin:
          type: string
          nullable: true
          example: '1234'
    SpeakRequest:
      type: object
      required:
      - text
      properties:
        text:
          type: string
          example: Witamy w naszej restauracji.
        id:
          type: string
          example: piper-pl_PL-mc_speech-medium
    AudioSinkRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          example: alsa_output.platform-soc_sound.stereo-fallback
    VolumeRequest:
      type: object
      required:
      - volume
      properties:
        volume:
          type: integer
          minimum: 0
          maximum: 150
          example: 80
    PlaceOrderRequest:
      type: object
      required:
      - cart
      - total
      properties:
        cart:
          type: array
          minItems: 1
          items:
            type: object
        total:
          type: number
          example: 29.0
        payment:
          type: object
          nullable: true
          additionalProperties: true
    DailyReportRequest:
      type: object
      required:
      - date
      properties:
        date:
          type: string
          format: date
          example: '2026-09-18'
    RangeReportRequest:
      type: object
      required:
      - date_from
      - date_to
      properties:
        date_from:
          type: string
          format: date
          example: '2026-09-01'
        date_to:
          type: string
          format: date
          example: '2026-09-18'
    SearchOrdersRequest:
      type: object
      properties:
        timestamp_from:
          type: string
          format: date-time
          nullable: true
          example: '2026-09-01T00:00:00+00:00'
        timestamp_to:
          type: string
          format: date-time
          nullable: true
          example: '2026-09-18T23:59:59+00:00'
        order_number_from:
          type: integer
          nullable: true
          example: 1
        order_number_to:
          type: integer
          nullable: true
          example: 1000
        name_contains:
          type: string
          example: burger
        price_from:
          type: number
          nullable: true
          example: 10
        price_to:
          type: number
          nullable: true
          example: 50
        qty_from:
          type: integer
          default: 0
          example: 1
        qty_to:
          type: integer
          default: 0
          example: 10
        sort_by:
          type: string
          enum:
          - timestamp
          - order_number
          - order_total
          default: timestamp
        sort_dir:
          type: string
          enum:
          - asc
          - desc
          default: desc
        page:
          type: integer
          default: 1
          example: 1
        page_size:
          type: integer
          default: 20
          example: 20
    FiscalRequest:
      type: object
      description: Raw JSON payload forwarded to the corresponding PosnetServer endpoint. The exact fields depend on the fiscal/order-confirmation
        operation.
      additionalProperties: true
      example:
        items:
        - name: Big Classic Burger
          price: 18
          qty: 1
          vat: A
        total: 18.0
    TerminalTransactionRequest:
      type: object
      required:
      - amount
      properties:
        amount:
          type: integer
          description: Transaction amount passed to the configured terminal provider.
          example: 2900
    AndroidTvVolumeRequest:
      type: object
      properties:
        level:
          type: integer
          example: 50
        stream:
          type: integer
          default: 3
          example: 3
    KioskLauncherBroadcastRequest:
      type: object
      properties:
        host:
          type: string
          example: 192.168.1.10
        protocol:
          type: string
          example: https
        path:
          type: string
          default: /kiosk/
          example: /kiosk/
        mode_url_user:
          type: string
          example: user
        mode_url_pass:
          type: string
          format: password
          example: secret
        gnirehtet:
          type: string
          example: 'on'
    AndroidConnectionRequest:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - usb
          - hdmi
          - network
          example: usb
    AndroidTapRequest:
      type: object
      required:
      - x
      - y
      properties:
        x:
          type: integer
          example: 500
        y:
          type: integer
          example: 300
    AndroidPointerRequest:
      type: object
      required:
      - value
      properties:
        value:
          type: integer
          enum:
          - 0
          - 1
          example: 1
    MovePathRequest:
      type: object
      required:
      - src
      - dst
      properties:
        src:
          type: string
          example: assets/old.png
        dst:
          type: string
          example: assets/new.png
    PathRequest:
      type: object
      required:
      - path
      properties:
        path:
          type: string
          example: assets/new-folder
    QrScannerDeviceRequest:
      type: object
      required:
      - device
      properties:
        device:
          type: string
          example: /dev/input/event5
    LicenseUseRequest:
      type: object
      properties:
        posnetserver:
          type: string
          nullable: true
          example: POSNET-LICENSE-UUID
        ingenicoserver:
          type: string
          nullable: true
          example: INGENICO-LICENSE-UUID
    GenericResponse:
      type: object
      additionalProperties: true
